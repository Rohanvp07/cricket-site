<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Football Match Stream</title>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #000;
            font-family: "Segoe UI", sans-serif;
            overflow: hidden;
        }

        iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;

            display: flex;
            gap: 10px;
            padding: 14px;

            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);

            flex-wrap: wrap;
        }

        select,
        button {
            padding: 10px 14px;
            border-radius: 10px;
            border: none;
            outline: none;
            font-size: 14px;
        }

        select {
            background: rgba(255,255,255,0.9);
            min-width: 180px;
        }

        button {
            background: #2ecc71;
            color: #000;
            cursor: pointer;
            font-weight: 700;
            transition: transform 0.2s, opacity 0.2s;
        }

        button:hover {
            transform: translateY(-1px);
            opacity: 0.9;
        }

        .toggle {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 11;

            background: rgba(0,0,0,0.6);
            color: white;

            padding: 8px 12px;
            border-radius: 10px;

            cursor: pointer;
            font-size: 13px;
        }

        @media (max-width: 768px) {

            .controls {
                flex-direction: column;
                width: 90%;
                bottom: 15px;
            }

            select,
            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="toggle" onclick="toggleControls()">
    ⚙️ Controls
</div>


<div class="controls" id="controls">

    <!-- League -->
    <select id="league" onchange="changeLeague()">
        <option value="epl" selected>Premier League</option>
        <option value="la-liga">La Liga</option>
    </select>


    <!-- Home Team -->
    <select id="team1"></select>


    <!-- Away Team -->
    <select id="team2"></select>


    <!-- Server -->
    <select id="server">
        <option value="stream-1" selected>Server 1</option>
        <option value="stream-2">Server 2</option>
         <option value="stream-3">Server 3</option>
    </select>


    <button onclick="loadMatch()">
        ⚽ Play Stream
    </button>

</div>


<!-- Stream -->
<iframe
    id="matchFrame"
    allowfullscreen
    allowtransparency>
</iframe>


<script>

/* =====================================
   TEAMS
===================================== */

const leagues = {

    "epl": [

        "Arsenal",
        "Aston Villa",
        "Bournemouth",
        "Brentford",
        "Brighton and Hove Albion",
        "Chelsea",
        "Coventry City",
        "Crystal Palace",
        "Everton",
        "Fulham",
        "Hull City",
        "Ipswich Town",
        "Leeds United",
        "Liverpool",
        "Manchester City",
        "Manchester United",
        "Newcastle United",
        "Nottingham Forest",
        "Southampton",
        "Sunderland",
        "Tottenham Hotspur"

    ],

    "la-liga": [

        "Alaves",
        "Athletic Bilbao",
        "Atletico Madrid",
        "Barcelona",
        "Celta Vigo",
        "Elche",
        "Espanyol",
        "Getafe",
        "Girona",
        "Levante",
        "Mallorca",
        "Osasuna",
        "Rayo Vallecano",
        "Real Betis",
        "Real Madrid",
        "Real Oviedo",
        "Real Sociedad",
        "Sevilla",
        "Valencia",
        "Villarreal"

    ]

};


/* =====================================
   ELEMENTS
===================================== */

const league =
    document.getElementById("league");

const team1 =
    document.getElementById("team1");

const team2 =
    document.getElementById("team2");

const server =
    document.getElementById("server");

const controls =
    document.getElementById("controls");


/* =====================================
   POPULATE TEAMS
===================================== */

function populateTeams() {

    const selectedLeague = league.value;

    const teams = leagues[selectedLeague];


    team1.innerHTML =
        `<option value="">Home Team</option>`;

    team2.innerHTML =
        `<option value="">Away Team</option>`;


    teams.forEach(team => {

        team1.add(
            new Option(team, team)
        );

        team2.add(
            new Option(team, team)
        );

    });

}


/* =====================================
   CHANGE LEAGUE
===================================== */

function changeLeague() {

    populateTeams();

}


/* =====================================
   FORMAT TEAM FOR URL
===================================== */

function formatTeam(team) {

    return team
        .toLowerCase()
        .replace(/&/g, "and")
        .replace(/\s+/g, "-");

}


/* =====================================
   LOAD MATCH
===================================== */

function loadMatch() {

    if (!team1.value || !team2.value) {

        alert("Please select both teams");
        return;

    }


    if (team1.value === team2.value) {

        alert("Teams must be different");
        return;

    }


    const streamUrl =
        `https://embedsports.me/${league.value}/` +
        `${formatTeam(team1.value)}-vs-` +
        `${formatTeam(team2.value)}-` +
        `${server.value}`;


    document
        .getElementById("matchFrame")
        .src = streamUrl;


    controls.style.display = "none";

}


/* =====================================
   SHOW / HIDE CONTROLS
===================================== */

function toggleControls() {

    controls.style.display =
        controls.style.display === "none"
            ? "flex"
            : "none";

}


/* =====================================
   INITIALIZE
===================================== */

populateTeams();

</script>

</body>
</html>
